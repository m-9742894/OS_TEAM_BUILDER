<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard Group — Register Group</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }

  :root {
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --accent: #ec4899;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --card: rgba(255, 255, 255, 0.06);
    --card-hover: rgba(255, 255, 255, 0.12);
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --border: rgba(255, 255, 255, 0.1);
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
    color: var(--text);
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow-x: hidden;
  }

  body::before,
  body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.4;
    z-index: 0;
    pointer-events: none;
  }
  body::before {
    width: 400px; height: 400px;
    background: var(--primary);
    top: -100px; left: -100px;
  }
  body::after {
    width: 400px; height: 400px;
    background: var(--accent);
    bottom: -100px; right: -100px;
  }

  .container {
    width: 100%;
    max-width: 900px;
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding-bottom: 40px;
  }

  /* PROFILE */
  .profile {
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(236, 72, 153, 0.15));
    border: 1px solid rgba(99, 102, 241, 0.3);
    border-radius: 20px;
    padding: 22px;
    display: flex;
    align-items: center;
    gap: 18px;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 30px rgba(99, 102, 241, 0.15);
    position: relative;
    overflow: hidden;
  }
  .profile::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, var(--primary), var(--accent));
  }

  .avatar {
    width: 60px; height: 60px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    font-weight: 800;
    color: #fff;
    flex-shrink: 0;
    box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
  }

  .profile-info { flex: 1; min-width: 0; }
  .profile-info .label {
    font-size: 0.72rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .profile-info .name {
    font-size: clamp(1rem, 2.5vw, 1.2rem);
    font-weight: 700;
    margin-bottom: 4px;
    word-break: break-word;
  }
  .profile-info .matrix {
    font-size: 0.85rem;
    color: var(--text-muted);
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .profile-info .status-badge {
    display: inline-block;
    margin-top: 8px;
    padding: 4px 10px;
    border-radius: 8px;
    font-size: 0.72rem;
    font-weight: 700;
    background: rgba(245, 158, 11, 0.2);
    color: #fcd34d;
    border: 1px solid rgba(245, 158, 11, 0.3);
  }
  .profile-info .status-badge.joined {
    background: rgba(16, 185, 129, 0.2);
    color: #6ee7b7;
    border-color: rgba(16, 185, 129, 0.3);
  }

  .logout-btn {
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--border);
    color: var(--text-muted);
    width: 40px; height: 40px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 1.1rem;
    transition: all 0.2s ease;
    flex-shrink: 0;
  }
  .logout-btn:hover {
    background: rgba(239, 68, 68, 0.2);
    color: #fca5a5;
    border-color: rgba(239, 68, 68, 0.3);
  }

  /* STATS */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 16px;
    backdrop-filter: blur(10px);
    transition: all 0.25s ease;
  }
  .stat-card:hover {
    transform: translateY(-2px);
    background: var(--card-hover);
  }
  .stat-card .stat-icon { font-size: 1.4rem; margin-bottom: 8px; }
  .stat-card .stat-value {
    font-size: clamp(1.4rem, 4vw, 1.8rem);
    font-weight: 800;
    margin-bottom: 4px;
    background: linear-gradient(135deg, #a5b4fc, #f0abfc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .stat-card .stat-label {
    font-size: 0.72rem;
    color: var(--text-muted);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .stat-card.joined { border-color: rgba(16, 185, 129, 0.3); }
  .stat-card.not-joined { border-color: rgba(245, 158, 11, 0.3); }

  /* SECTION */
  .section {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 0 4px;
  }
  .section-header h2 {
    font-size: 1.1rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-header h2 .badge {
    font-size: 0.7rem;
    padding: 3px 8px;
    border-radius: 8px;
    background: rgba(99, 102, 241, 0.25);
    color: #a5b4fc;
    font-weight: 700;
  }
  .create-btn {
    padding: 10px 16px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    border: none;
    color: #fff;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s ease;
    box-shadow: 0 6px 18px rgba(99, 102, 241, 0.4);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .create-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(99, 102, 241, 0.6);
  }
  .create-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    box-shadow: none;
  }

  /* GROUP LIST */
  .group-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .group-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    backdrop-filter: blur(10px);
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }
  .group-card::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: linear-gradient(180deg, var(--primary), var(--accent));
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .group-card:hover {
    background: var(--card-hover);
    transform: translateY(-2px);
    border-color: rgba(99, 102, 241, 0.4);
  }
  .group-card:hover::before { opacity: 1; }

  .group-card.my-group {
    border-color: rgba(16, 185, 129, 0.4);
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(99, 102, 241, 0.08));
  }
  .group-card.my-group::before {
    background: linear-gradient(180deg, var(--success), var(--primary));
    opacity: 1;
  }

  .group-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 10px;
  }
  .group-title {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 0;
  }
  .group-icon {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
  }
  .group-name {
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .group-creator {
    font-size: 0.75rem;
    color: var(--text-muted);
    font-weight: 600;
  }
  .group-creator strong { color: #c7d2fe; }

  .group-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed rgba(255,255,255,0.08);
  }
  .member-count {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--text);
    background: rgba(99, 102, 241, 0.15);
    padding: 6px 12px;
    border-radius: 10px;
    border: 1px solid rgba(99, 102, 241, 0.25);
  }
  .member-count.full-count {
    background: rgba(239, 68, 68, 0.15);
    border-color: rgba(239, 68, 68, 0.3);
    color: #fca5a5;
  }

  .join-btn {
    margin-left: auto;
    padding: 8px 18px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    border: none;
    color: #fff;
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
  }
  .join-btn:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 6px 18px rgba(99, 102, 241, 0.6);
  }
  .join-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    box-shadow: none;
    background: rgba(148, 163, 184, 0.3);
  }
  .join-btn.joined {
    background: rgba(16, 185, 129, 0.2);
    color: #6ee7b7;
    border: 1px solid rgba(16, 185, 129, 0.4);
    box-shadow: none;
  }
  .join-btn.creator {
    background: rgba(245, 158, 11, 0.2);
    color: #fcd34d;
    border: 1px solid rgba(245, 158, 11, 0.4);
    box-shadow: none;
  }

  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--text-muted);
    background: var(--card);
    border: 1px dashed var(--border);
    border-radius: 16px;
  }
  .empty-state .emoji { font-size: 2.5rem; margin-bottom: 10px; }
  .empty-state .title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 4px;
  }
  .empty-state .desc { font-size: 0.85rem; }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
    animation: fadeIn 0.2s ease;
  }
  .modal-overlay.show { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    background: linear-gradient(135deg, #1e1b4b, #0f172a);
    border: 1px solid var(--border);
    border-radius: 20px;
    width: 100%;
    max-width: 460px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 24px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
    animation: slideUp 0.3s ease;
    position: relative;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 20px;
    gap: 12px;
  }
  .modal-header h3 {
    font-size: 1.2rem;
    font-weight: 800;
    background: linear-gradient(90deg, #a5b4fc, #f0abfc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .modal-header p {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .modal-close {
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--border);
    color: var(--text);
    width: 34px; height: 34px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 1rem;
    transition: all 0.2s ease;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-close:hover {
    background: rgba(239, 68, 68, 0.2);
    color: #fca5a5;
  }

  .form-group { margin-bottom: 18px; }
  .form-group label {
    display: block;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
  }
  .form-group .hint {
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 6px;
  }
  .form-group input[type="text"] {
    width: 100%;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
    transition: all 0.25s ease;
  }
  .form-group input[type="text"]:focus {
    border-color: var(--primary);
    background: var(--card-hover);
    box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
  }

  .size-selector {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
  }
  .size-btn {
    padding: 12px 0;
    border-radius: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .size-btn:hover {
    background: var(--card-hover);
    border-color: rgba(99, 102, 241, 0.5);
  }
  .size-btn.active {
    background: linear-gradient(135deg, var(--primary), var(--accent));
    border-color: transparent;
    color: #fff;
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.5);
    transform: scale(1.05);
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 22px;
  }
  .btn-secondary, .btn-primary {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: all 0.25s ease;
  }
  .btn-secondary {
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.12); }
  .btn-primary {
    background: linear-gradient(135deg, var(--primary), var(--accent));
    color: #fff;
    box-shadow: 0 6px 18px rgba(99, 102, 241, 0.5);
  }
  .btn-primary:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(99, 102, 241, 0.7);
  }
  .btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    box-shadow: none;
  }

  .members-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 320px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .member-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    transition: all 0.2s ease;
  }
  .member-item:hover { background: var(--card-hover); }
  .member-item .m-num {
    width: 32px; height: 32px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    color: #fff;
    flex-shrink: 0;
  }
  .member-item.creator .m-num {
    background: linear-gradient(135deg, var(--warning), var(--accent));
  }
  .member-item .m-info { flex: 1; min-width: 0; }
  .member-item .m-matrix {
    font-size: 0.7rem;
    color: var(--text-muted);
    font-weight: 600;
    letter-spacing: 0.5px;
  }
  .member-item .m-name {
    font-size: 0.88rem;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .member-item .creator-badge {
    font-size: 0.62rem;
    padding: 3px 8px;
    border-radius: 6px;
    background: rgba(245, 158, 11, 0.2);
    color: #fcd34d;
    font-weight: 700;
    flex-shrink: 0;
  }
  .member-item .you-badge {
    font-size: 0.62rem;
    padding: 3px 8px;
    border-radius: 6px;
    background: rgba(16, 185, 129, 0.2);
    color: #6ee7b7;
    font-weight: 700;
    flex-shrink: 0;
  }

  .info-box {
    background: rgba(99, 102, 241, 0.1);
    border: 1px solid rgba(99, 102, 241, 0.2);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 0.82rem;
    color: #c7d2fe;
    margin-bottom: 16px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
  }
  .info-box.warning {
    background: rgba(245, 158, 11, 0.1);
    border-color: rgba(245, 158, 11, 0.3);
    color: #fcd34d;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: rgba(30, 41, 59, 0.95);
    border: 1px solid var(--border);
    backdrop-filter: blur(12px);
    color: #fff;
    padding: 14px 22px;
    border-radius: 14px;
    font-size: 0.9rem;
    font-weight: 600;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    z-index: 2000;
    opacity: 0;
    transition: all 0.35s ease;
    max-width: 90%;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
  .toast.success { border-color: rgba(16, 185, 129, 0.5); }
  .toast.error { border-color: rgba(239, 68, 68, 0.5); }

  /* Responsive */
  @media (max-width: 600px) {
    body { padding: 12px; }
    .container { gap: 16px; }
    .profile { padding: 18px; gap: 14px; border-radius: 16px; }
    .avatar { width: 50px; height: 50px; font-size: 1.3rem; border-radius: 14px; }
    .stats { gap: 8px; }
    .stat-card { padding: 14px 10px; border-radius: 14px; }
    .stat-card .stat-icon { font-size: 1.1rem; margin-bottom: 4px; }
    .stat-card .stat-label { font-size: 0.62rem; }
    .section-header h2 { font-size: 1rem; }
    .create-btn { font-size: 0.78rem; padding: 9px 14px; }
    .group-card { padding: 14px; border-radius: 14px; }
    .group-icon { width: 36px; height: 36px; font-size: 1rem; border-radius: 10px; }
    .group-name { font-size: 0.92rem; }
    .group-meta { flex-wrap: wrap; gap: 8px; }
    .member-count { font-size: 0.75rem; padding: 5px 10px; }
    .join-btn { padding: 7px 14px; font-size: 0.78rem; }
    .modal { padding: 20px; border-radius: 18px; }
    .size-selector { grid-template-columns: repeat(4, 1fr); }
  }
  @media (max-width: 380px) {
    .profile-info .name { font-size: 0.95rem; }
    .stat-card .stat-value { font-size: 1.2rem; }
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb {
    background: rgba(99, 102, 241, 0.5);
    border-radius: 4px;
  }
</style>
</head>
<body>

  <div class="container">

    <!-- PROFILE -->
    <div class="profile">
      <div class="avatar" id="avatar">?</div>
      <div class="profile-info">
        <div class="label">Pelajar</div>
        <div class="name" id="profileName">Loading...</div>
        <div class="matrix" id="profileMatrix">-</div>
        <div class="status-badge" id="profileStatus">Belum join group</div>
      </div>
      <button class="logout-btn" id="logoutBtn" title="Tukar pelajar">⎋</button>
    </div>

    <!-- STATS -->
    <div class="stats">
      <div class="stat-card">
        <div class="stat-icon">👥</div>
        <div class="stat-value" id="totalStudents">0</div>
        <div class="stat-label">Total Pelajar</div>
      </div>
      <div class="stat-card joined">
        <div class="stat-icon">✅</div>
        <div class="stat-value" id="joinedCount">0</div>
        <div class="stat-label">Dah Join</div>
      </div>
      <div class="stat-card not-joined">
        <div class="stat-icon">⏳</div>
        <div class="stat-value" id="notJoinedCount">0</div>
        <div class="stat-label">Belum Join</div>
      </div>
    </div>

    <!-- GROUP SECTION -->
    <div class="section">
      <div class="section-header">
        <h2>
          Senarai Group
